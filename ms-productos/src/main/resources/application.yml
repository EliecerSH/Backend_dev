server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-productos

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # Antes un error dejaba el mensaje en un ciclo infinito de reintentos.
        # Ahora: 3 intentos y luego se descarta sin reencolar.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

  kafka:
    # Broker Kafka en la EC2 de Backend_dev03 (IP privada:9092). Solo para auditoría.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI}
          tenant-id: ${AZURE_TENANT_ID}
          client-id: ${AZURE_CLIENT_ID}

pedidos360:
  exchange: pedidos360.exchange
  queue:
    stock: pedidos360.stock.queue
  routing-key:
    orden-creada: pedidos360.orden.creada
  auditoria:
    # Tópico Kafka de auditoría (reemplaza la cola RabbitMQ pedidos360.auditoria.queue)
    topic: ${TOPIC_AUDITORIA:auditoria.eventos}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    org.springframework.security: INFO
    org.apache.kafka: WARN
