services:
  ms-usuarios:
    image: ${ECR_REGISTRY}/ms-usuarios:latest
    container_name: ecommerce-ms-usuarios
    ports:
      - "8081:8081"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ecommerce-network
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    restart: unless-stopped

  ms-productos:
    image: ${ECR_REGISTRY}/ms-productos:latest
    container_name: ecommerce-ms-productos
    ports:
      - "8082:8082"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ecommerce-network
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    restart: unless-stopped

  ms-carrito:
    image: ${ECR_REGISTRY}/ms-carrito:latest
    container_name: ecommerce-ms-carrito
    ports:
      - "8083:8083"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ecommerce-network
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      PRODUCTOS_SERVICE_URL: ${PRODUCTOS_SERVICE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    restart: unless-stopped

networks:
  ecommerce-network:
    external: true

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pedidos360-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ecommerce-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    restart: unless-stopped

  ms-ordenes:
    image: ${ECR_REGISTRY}/ms-ordenes:latest
    container_name: ecommerce-ms-ordenes
    ports:
      - "8084:8084"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ecommerce-network
    depends_on:
      - rabbitmq
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    restart: unless-stopped

  ms-notificaciones:
    image: ${ECR_REGISTRY}/ms-notificaciones:latest
    container_name: ecommerce-ms-notificaciones
    ports:
      - "8085:8085"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ecommerce-network
    depends_on:
      - rabbitmq
    environment:
      SERVER_PORT: 8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      NOTIFICACIONES_MODO_SIMULADO: ${NOTIFICACIONES_MODO_SIMULADO}
    restart: unless-stopped

  ms-auditoria:
    image: ${ECR_REGISTRY}/ms-auditoria:latest
    container_name: ecommerce-ms-auditoria
    ports:
      - "8086:8086"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - ecommerce-network
    depends_on:
      - rabbitmq
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: ${DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    restart: unless-stopped